[package]
name = "prism-mail-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Prism Mail online desktop shell + Proton Bridge connector stubs"

[lib]
name = "prism_mail_desktop"
path = "src/lib.rs"

[[bin]]
name = "prism-mail-desktop"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
